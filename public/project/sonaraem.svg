<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-labelledby="sonaraem-pipeline-title">
  <title id="sonaraem-pipeline-title">Sonaraem six-stage pipeline: Sync, Classify, Embed, Cluster, Generate, Export</title>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd" />
    </marker>
  </defs>

  <rect width="800" height="450" fill="#ffffff" />

  <text x="400" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Sonaraem — Six-Stage Pipeline</text>
  <text x="400" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748b">Trigger.dev v4 background jobs — one library sync at a time</text>

  <!-- Row 1: Sync -> Classify -> Embed -->
  <g>
    <rect x="40" y="96" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="68" cy="124" r="14" fill="#2563eb" />
    <text x="68" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="92" y="129" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Sync</text>
    <text x="60" y="156" font-family="Arial, sans-serif" font-size="12" fill="#334155">Pull saved tracks +</text>
    <text x="60" y="172" font-family="Arial, sans-serif" font-size="12" fill="#334155">playlists from Spotify</text>
    <text x="60" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Spotify Web API</text>
  </g>

  <line x1="260" y1="152" x2="286" y2="152" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />

  <g>
    <rect x="290" y="96" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="318" cy="124" r="14" fill="#2563eb" />
    <text x="318" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="342" y="129" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Classify</text>
    <text x="310" y="156" font-family="Arial, sans-serif" font-size="12" fill="#334155">Mood, theme, energy,</text>
    <text x="310" y="172" font-family="Arial, sans-serif" font-size="12" fill="#334155">era, genre per track</text>
    <text x="310" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Groq gpt-oss-20b</text>
  </g>

  <line x1="510" y1="152" x2="536" y2="152" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />

  <g>
    <rect x="540" y="96" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="568" cy="124" r="14" fill="#2563eb" />
    <text x="568" y="129" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">3</text>
    <text x="592" y="129" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Embed</text>
    <text x="560" y="156" font-family="Arial, sans-serif" font-size="12" fill="#334155">Turn each classification</text>
    <text x="560" y="172" font-family="Arial, sans-serif" font-size="12" fill="#334155">into a semantic vector</text>
    <text x="560" y="194" font-family="Arial, sans-serif" font-size="11" fill="#64748b">OpenAI text-embedding-3-small</text>
  </g>

  <!-- Connector: end of row 1 down to start of row 2 -->
  <path d="M650,208 L650,236 L650,264" fill="none" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Row 2: Cluster -> Generate -> Export (right to left) -->
  <g>
    <rect x="540" y="268" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="568" cy="296" r="14" fill="#2563eb" />
    <text x="568" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">4</text>
    <text x="592" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Cluster</text>
    <text x="560" y="328" font-family="Arial, sans-serif" font-size="12" fill="#334155">Group tracks by</text>
    <text x="560" y="344" font-family="Arial, sans-serif" font-size="12" fill="#334155">embedding similarity</text>
    <text x="560" y="366" font-family="Arial, sans-serif" font-size="11" fill="#64748b">DBSCAN, per-user adaptive eps</text>
  </g>

  <line x1="536" y1="324" x2="510" y2="324" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />

  <g>
    <rect x="290" y="268" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="318" cy="296" r="14" fill="#2563eb" />
    <text x="318" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">5</text>
    <text x="342" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Generate</text>
    <text x="310" y="328" font-family="Arial, sans-serif" font-size="12" fill="#334155">Name each cluster,</text>
    <text x="310" y="344" font-family="Arial, sans-serif" font-size="12" fill="#334155">enforce artist diversity</text>
    <text x="310" y="366" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Groq gpt-oss-120b</text>
  </g>

  <line x1="286" y1="324" x2="260" y2="324" stroke="#93c5fd" stroke-width="2" marker-end="url(#arrow)" />

  <g>
    <rect x="40" y="268" width="220" height="112" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
    <circle cx="68" cy="296" r="14" fill="#2563eb" />
    <text x="68" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">6</text>
    <text x="92" y="301" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Export</text>
    <text x="60" y="328" font-family="Arial, sans-serif" font-size="12" fill="#334155">Write playlists back</text>
    <text x="60" y="344" font-family="Arial, sans-serif" font-size="12" fill="#334155">to the user's account</text>
    <text x="60" y="366" font-family="Arial, sans-serif" font-size="11" fill="#64748b">Spotify Web API</text>
  </g>

  <text x="400" y="420" text-anchor="middle" font-family="Arial, sans-serif" font-size="11.5" fill="#94a3b8">Next.js 16 · oRPC · Better Auth · Neon + Drizzle · pnpm/Turborepo</text>
</svg>
