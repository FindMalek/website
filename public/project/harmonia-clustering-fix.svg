<svg xmlns="http://www.w3.org/2000/svg" width="700" height="380" viewBox="0 0 700 380" role="img" aria-labelledby="harmonia-clustering-title">
  <title id="harmonia-clustering-title">Playlists produced from a 2,500+ track library: 2 to 3 before the adaptive-eps fix, versus 25 to 35 expected after</title>

  <rect width="700" height="380" fill="#ffffff" />

  <text x="350" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="16.5" font-weight="700" fill="#0f172a">Playlists produced from a 2,500+ track library</text>
  <text x="350" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="12.5" fill="#64748b">Fixed dbscan eps vs. the per-user adaptive heuristic (harmonia#111 → #329)</text>

  <!-- gridlines -->
  <line x1="100" y1="320" x2="600" y2="320" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="100" y1="95" x2="600" y2="95" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,4" />
  <text x="90" y="324" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">0</text>
  <text x="90" y="99" text-anchor="end" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">35</text>

  <!-- Before bar: 2-3 playlists (fixed eps) -->
  <rect x="180" y="301" width="140" height="19" rx="4" fill="#ec835a" />
  <text x="250" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">2–3 playlists</text>
  <text x="250" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">✕ Fixed eps (before)</text>

  <!-- After bar: 25-35 expected (adaptive eps) -->
  <rect x="380" y="95" width="140" height="225" rx="4" fill="#0ca30c" />
  <text x="450" y="83" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#0f172a">25–35 expected</text>
  <text x="450" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#334155">✓ Adaptive eps (after)</text>

  <text x="350" y="372" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#94a3b8">Same library, same DBSCAN algorithm — eps tuned relative to library size instead of fixed</text>
</svg>
