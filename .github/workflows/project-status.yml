# Keeps the "FindMalek Website" project board (user project 12) honest:
#   - new issues without a Status get Backlog
#   - closed issues, and issues named by a closing keyword in a merged PR, get Done
#
# The board's own "Item added to project" and "Item closed" workflows can only be
# switched on in the project UI, and "Pull request merged" ignores PRs that target
# a non-default branch. This is the backstop for all three.
#
# Requires the repo secret PROJECT_TOKEN: a PAT with project read/write
# (GITHUB_TOKEN cannot write to a user-owned project). Without it the job logs a
# notice and passes, it never fails a PR.

name: Project status

on:
  issues:
    types: [opened, reopened, closed]
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: project-status-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  set-status:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    env:
      PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
    steps:
      - name: Skip without PROJECT_TOKEN
        if: env.PROJECT_TOKEN == ''
        run: echo "::notice::PROJECT_TOKEN is not set, project status was not updated"

      - name: Set project status
        if: env.PROJECT_TOKEN != ''
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const OWNER = "FindMalek"
            const PROJECT_NUMBER = 12
            const { owner, repo } = context.repo

            const project = (
              await github.graphql(
                `query($login: String!, $number: Int!) {
                  user(login: $login) {
                    projectV2(number: $number) {
                      id
                      field(name: "Status") {
                        ... on ProjectV2SingleSelectField { id options { id name } }
                      }
                    }
                  }
                }`,
                { login: OWNER, number: PROJECT_NUMBER }
              )
            ).user.projectV2

            const optionId = (name) =>
              project.field.options.find((option) => option.name === name)?.id

            async function findItem(contentId) {
              const data = await github.graphql(
                `query($id: ID!) {
                  node(id: $id) {
                    ... on Issue { projectItems(first: 20) { nodes { id project { id }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }
                    ... on PullRequest { projectItems(first: 20) { nodes { id project { id }
                      fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } } } } }
                  }
                }`,
                { id: contentId }
              )
              return data.node.projectItems.nodes.find(
                (item) => item.project.id === project.id
              )
            }

            async function setStatus(contentId, status, { onlyIfEmpty = false } = {}) {
              let item = await findItem(contentId)
              // "Auto-add to project" runs in parallel, give it a moment
              for (let i = 0; !item && i < 6; i++) {
                await new Promise((resolve) => setTimeout(resolve, 5000))
                item = await findItem(contentId)
              }
              if (!item) {
                const added = await github.graphql(
                  `mutation($project: ID!, $content: ID!) {
                    addProjectV2ItemById(input: { projectId: $project, contentId: $content }) { item { id } }
                  }`,
                  { project: project.id, content: contentId }
                )
                item = { id: added.addProjectV2ItemById.item.id }
              }
              const current = item.fieldValueByName?.name
              if (current === status || (onlyIfEmpty && current)) return
              await github.graphql(
                `mutation($project: ID!, $item: ID!, $field: ID!, $option: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $project, itemId: $item, fieldId: $field,
                    value: { singleSelectOptionId: $option }
                  }) { projectV2Item { id } }
                }`,
                {
                  project: project.id,
                  item: item.id,
                  field: project.field.id,
                  option: optionId(status),
                }
              )
              core.info(`set ${status} on ${contentId}`)
            }

            if (context.eventName === "issues") {
              const issue = context.payload.issue
              if (context.payload.action === "closed") {
                await setStatus(issue.node_id, "Done")
              } else {
                await setStatus(issue.node_id, "Backlog", { onlyIfEmpty: true })
              }
            } else {
              const pr = context.payload.pull_request
              await setStatus(pr.node_id, "Done")
              const refs = new Set(
                [...(pr.body ?? "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)]
                  .map((match) => Number(match[1]))
              )
              for (const number of refs) {
                const { data } = await github.rest.issues.get({ owner, repo, issue_number: number })
                await setStatus(data.node_id, "Done")
              }
            }
